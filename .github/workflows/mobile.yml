name: Mobile

# Builds the Capacitor apps from the same web build: a debug APK you can install on any
# Android phone (download it from the run's artifacts), and an iOS simulator build that
# proves the Xcode project compiles. Signed store builds are described in docs/MOBILE.md.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - name: Build the web app and copy it into the native projects
        run: npm run mobile:sync -w @deadminton/web
      - name: Build the debug APK
        working-directory: apps/web/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: deadminton-debug-apk
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the web app and copy it into the native projects
        run: npm run mobile:sync -w @deadminton/web
      - name: Build for the iOS simulator (unsigned)
        working-directory: apps/web/ios/App
        run: >
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build

  # Run by hand (Actions → Mobile → Run workflow) once the upload key is set up as secrets:
  # ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD.
  android-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run mobile:sync -w @deadminton/web
      - name: Build the signed release bundle (.aab) for Google Play
        working-directory: apps/web/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          DEADMINTON_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DEADMINTON_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add the ANDROID_KEYSTORE_BASE64 secret first (see docs/MOBILE.md)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          DEADMINTON_KEYSTORE="$RUNNER_TEMP/upload.jks" ./gradlew bundleRelease --no-daemon \
            -PversionCode=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: deadminton-release-aab
          path: apps/web/android/app/build/outputs/bundle/release/app-release.aab
